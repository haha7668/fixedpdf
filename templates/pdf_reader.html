    /* ========== Selection Module ========== */
    const Sel = {
        _selText: null, _selRect: null, _selRects: null, _selPage: null,

        init() {
            const toolbar = document.getElementById('selection-toolbar');
            const lookup = document.getElementById('lookup-popup');
            this._initDrag();

            viewer.addEventListener('mouseup', () => { setTimeout(() => this._check(), 10); });
            let _selTimer = null;
            document.addEventListener('selectionchange', () => {
                if (!('ontouchstart' in window)) return;
                clearTimeout(_selTimer);
                _selTimer = setTimeout(() => {
                    const sel = window.getSelection();
                    if (!sel.toString().trim() || !viewer.contains(sel.anchorNode)) return;
                    this._check();
                }, 300);
            });
            document.addEventListener('mousedown', (e) => {
                if (!toolbar.contains(e.target)) toolbar.classList.remove('visible');
                if (!lookup.contains(e.target) && !toolbar.contains(e.target)) {
                    lookup.classList.remove('visible');
                    // 递增令牌：进行中的翻译返回后不再把弹窗弹回来。
                    this._lookupToken++;
                }
            });
            viewer.addEventListener('scroll', () => {
                toolbar.classList.remove('visible');
                lookup.classList.remove('visible');
                this._lookupToken++;
            }, { passive: true });
        },
        _check() {
            const sel = window.getSelection();
            const text = sel.toString().trim();
            if (!text || text.length < 1) return;
            if (!viewer.contains(sel.anchorNode)) return;

            this._selText = text;
            const range = sel.getRangeAt(0);
            const rect = range.getBoundingClientRect();
            this._selRect = { top: rect.top, bottom: rect.bottom, left: rect.left, right: rect.right, width: rect.width, height: rect.height };

            // Capture selection rects relative to page for highlighting
            const pageContainer = sel.anchorNode.parentElement?.closest('.pdf-page-container');
            if (pageContainer) {
                this._selPage = parseInt(pageContainer.dataset.pageNum);
                const pageRect = pageContainer.getBoundingClientRect();
                const pw = pageContainer.offsetWidth, ph = pageContainer.offsetHeight;
                const rects = [];
                const clientRects = range.getClientRects();
                for (let i = 0; i < clientRects.length; i++) {
                    const cr = clientRects[i];
                    rects.push([
                        cr.left - pageRect.left, cr.top - pageRect.top,
                        cr.right - pageRect.left, cr.bottom - pageRect.top,
                        pw, ph
                    ]);
                }
                this._selRects = rects;
            }

            const toolbar = document.getElementById('selection-toolbar');
            toolbar.classList.remove('visible');
            void toolbar.offsetWidth;
            toolbar.style.visibility = 'hidden'; toolbar.classList.add('visible');
            const tbW = toolbar.offsetWidth, tbH = toolbar.offsetHeight;
            toolbar.style.visibility = '';

            let top = rect.top - tbH - 15;
            let left = rect.left + (rect.width / 2) - (tbW / 2);
            if (top < 10) top = rect.bottom + 8;
            if (top + tbH > window.innerHeight - 8) top = Math.max(10, rect.top - tbH - 15);
            left = Math.max(8, Math.min(left, window.innerWidth - tbW - 8));
            toolbar.style.top = top + 'px'; toolbar.style.left = left + 'px';
            toolbar.classList.add('visible');

            // Auto-translate short text
            const wordCount = text.split(/\s+/).length;
            if (wordCount <= 3 && text.length <= 40 && !text.includes('\n')) {
                const clean = text.replace(/^[\s\p{P}\p{S}]+|[\s\p{P}\p{S}]+$/gu, '');
                if (clean) this._doTranslate(clean);
            }
        },
        highlight(color) {
            if (!this._selText || !this._selRects || !this._selPage) return;
            Highlights.add(this._selPage, this._selText, this._selRects, color);
            document.getElementById('selection-toolbar').classList.remove('visible');
            window.getSelection().removeAllRanges();
        },
        quickTranslate() {
            if (!this._selText) return;
            document.getElementById('selection-toolbar').classList.remove('visible');
            window.getSelection().removeAllRanges();
            this._doTranslate(this._selText);
        },
        lookup() {
            if (!this._selText) return;
            document.getElementById('selection-toolbar').classList.remove('visible');
            window.getSelection().removeAllRanges();
            this._doLookup(this._selText);
        },
        askAI() {
            if (!this._selText) return;
            const text = this._selText;
            document.getElementById('selection-toolbar').classList.remove('visible');
            window.getSelection().removeAllRanges();
            const panel = document.getElementById('panels-container');
            if (panel.classList.contains('collapsed')) toggleRight();
            // 直接把选中文本作为问题发送（同时作为上下文，让 AI 结合原文回答）
            AI._send(text, text);
        },
        closeLookup() {
            document.getElementById('lookup-popup').classList.remove('visible');
            this._draggedPos = null;
            // 递增令牌：正在进行的翻译请求返回后不再重新弹出。
            this._lookupToken++;
        },
        _draggedPos: null,
        _lookupToken: 0,
        _initDrag() {
            const popup = document.getElementById('lookup-popup');
            const handle = document.getElementById('lookup-drag-handle');
            if (!popup || !handle) return;
            let dragging = false, startX = 0, startY = 0, origLeft = 0, origTop = 0;
            const onMove = (e) => {
                if (!dragging) return;
                const x = e.clientX, y = e.clientY;
                let left = origLeft + (x - startX);
                let top = origTop + (y - startY);
                left = Math.max(8, Math.min(left, window.innerWidth - popup.offsetWidth - 8));
                top = Math.max(8, Math.min(top, window.innerHeight - popup.offsetHeight - 8));
                popup.style.left = left + 'px';
                popup.style.top = top + 'px';
            };
            const onUp = () => {
                if (!dragging) return;
                dragging = false;
                popup.classList.remove('dragging');
                // 记录拖动后的位置，下次显示时沿用
                this._draggedPos = { left: parseFloat(popup.style.left), top: parseFloat(popup.style.top) };
                document.removeEventListener('mousemove', onMove);
                document.removeEventListener('mouseup', onUp);
            };
            handle.addEventListener('mousedown', (e) => {
                e.preventDefault();
                dragging = true;
                startX = e.clientX; startY = e.clientY;
                origLeft = parseFloat(popup.style.left) || popup.offsetLeft || 0;
                origTop = parseFloat(popup.style.top) || popup.offsetTop || 0;
                popup.classList.add('dragging');
                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
            });
        },
        _speak(text) {
            const cjk = [...text].filter(c => c >= '\u4e00' && c <= '\u9fff').length;
            const voice = cjk > text.length * 0.3 ? 'zh-CN-XiaoxiaoNeural' : 'en-US-JennyNeural';
            new Audio(`/api/tts?text=${encodeURIComponent(text.substring(0, 500))}&voice=${voice}`).play().catch(() => {});
        },
        async _doTranslate(text) {
            const el = document.getElementById('lookup-content');
            el.innerHTML = '<div class="lookup-loading">翻译中...</div>';
            // 记录本次请求：用户中途关掉弹窗后，异步结果回来不该再把它弹出来。
            const token = ++this._lookupToken;
            this._showLookup();
            try {
                const resp = await fetch('/api/quick-translate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
                const data = await resp.json();
                let html = '';
                function _escH(t) { return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
                const safe = text.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, ' ');
                const spk = `<button onclick="Sel._speak('${safe}')" style="background:none;border:none;cursor:pointer;padding:2px 4px;vertical-align:middle;opacity:0.5;transition:opacity 0.2s" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.5" title="${t('Pronounce')}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg></button>`;
                if (data.source === 'dict') {
                    html += `<div style="font-size:0.75rem;color:var(--secondary);margin-bottom:6px"><b>${_escH(data.word)}</b>`;
                    if (data.phonetic) html += ` <span style="opacity:0.6">/${_escH(data.phonetic)}/</span>`;
                    html += ` ${spk}</div>`;
                    if (data.translation) html += `<div class="lookup-translation">${_escH(data.translation).replace(/\n/g, '<br>')}</div>`;
                    if (data.definition) html += `<div class="lookup-explanation" style="margin-top:6px;font-size:0.78rem">${_escH(data.definition).split('\n').slice(0, 2).join('<br>')}</div>`;
                } else if (data.source === 'cn-dict' || data.source === 'ai-dict') {
                    html += `<div style="font-size:0.75rem;color:var(--secondary);margin-bottom:6px"><b>${_escH(data.word)}</b>`;
                    if (data.pinyin) html += ` <span style="opacity:0.6">${_escH(data.pinyin)}</span>`;
                    html += ` ${spk}</div>`;
                    html += `<div class="lookup-translation">${_escH(data.translation).replace(/\n/g, '<br>')}</div>`;
                } else if (data.translation) {
                    html += `<div class="lookup-translation">${_escH(data.translation)} ${spk}</div>`;
                }
                el.innerHTML = html || '<div class="lookup-loading">无结果</div>';
                if (token === this._lookupToken) this._showLookup();
            } catch (e) {
                el.innerHTML = '<div class="lookup-loading">翻译失败</div>';
                if (token === this._lookupToken) this._showLookup();
            }
        },
        async _doLookup(text) {
            const el = document.getElementById('lookup-content');
            el.innerHTML = '<div class="lookup-loading">查询中…</div>';
            const token = ++this._lookupToken;
            this._showLookup();
            try {
                const resp = await fetch('/api/ai-explain', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
                const data = await resp.json();
                if (data.explanation) {
                    el.innerHTML = _md(data.explanation);
                } else {
                    el.innerHTML = '<div class="lookup-explanation" style="opacity:0.5">未获取到解释</div>';
                }
                if (token === this._lookupToken) this._showLookup();
            } catch (e) {
                el.innerHTML = '<div class="lookup-loading">查询失败</div>';
                if (token === this._lookupToken) this._showLookup();
            }
        },
        _showLookup() {
            const popup = document.getElementById('lookup-popup');
            const rect = this._selRect;
            if (!rect) return;
            popup.style.visibility = 'hidden'; popup.classList.add('visible');
            const pw = popup.offsetWidth, ph = popup.offsetHeight;
            popup.style.visibility = '';

            // 若用户已手动拖动过位置，则沿用拖动后的位置，不再自动跟随选中文本
            if (this._draggedPos) {
                let left = this._draggedPos.left, top = this._draggedPos.top;
                left = Math.max(8, Math.min(left, window.innerWidth - pw - 8));
                top = Math.max(8, Math.min(top, window.innerHeight - ph - 8));
                popup.style.top = top + 'px'; popup.style.left = left + 'px';
                popup.classList.add('visible');
                return;
            }

            let top = rect.bottom + 10, left = rect.left + (rect.width / 2) - (pw / 2);
            if (top + ph > window.innerHeight - 20) top = rect.top - ph - 10;
            left = Math.max(12, Math.min(left, window.innerWidth - pw - 12));
            top = Math.max(10, top);
            popup.style.top = top + 'px'; popup.style.left = left + 'px';
            popup.classList.add('visible');
        }
    };
    window.Sel = Sel;

    /* ========== Search Module ========== */
    const Search = {
        _results: [], _timer: null, _activeIdx: -1, _query: '',
        debounce() {
            clearTimeout(this._timer);
            this._timer = setTimeout(() => this.run(), 400);
        },
        async run() {
            const query = document.getElementById('search-input').value.trim();
            this._query = query;
            if (!query) { this._results = []; this._clearHighlights(); this._render(); return; }
            document.getElementById('search-status').textContent = t('Searching...');
            try {
                const resp = await fetch(`/api/pdf-search/${encodeURIComponent(BOOK_ID)}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query })
                });
                const data = await resp.json();
                this._results = data.results || [];
                this._render();
                // Highlight on rendered pages
                this._clearHighlights();
                pageContainers.forEach((_, i) => { if (pageRendered[i]) this.renderPageHighlights(i + 1); });
            } catch (e) {
                document.getElementById('search-status').textContent = 'Search failed';
            }
        },
        _render() {
            const status = document.getElementById('search-status');
            const container = document.getElementById('search-results');
            if (!this._results.length) {
                status.textContent = this._query ? t('No results found') : '';
                container.innerHTML = ''; return;
            }
            status.textContent = `${this._results.length} ${t('results found')}`;
            container.innerHTML = this._results.map((r, idx) => {
                const safeSnippet = r.snippet.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c]));
                const snippet = safeSnippet.replace(new RegExp(`(${this._query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi'), '<mark>$1</mark>');
                return `<div class="sp-item" onclick="Search.goTo(${idx})"><span class="sp-page">${t('Page')} ${r.page}</span><div class="sp-snippet">${snippet}</div></div>`;
            }).join('');
        },
        goTo(idx) {
            const r = this._results[idx];
            if (r) TOC.goTo(r.page);
        },
        renderPageHighlights(pageNum) {
            if (!this._query || !this._results.length) return;
            const container = pageContainers[pageNum - 1];
            if (!container) return;
            // Remove old search highlights
            container.querySelectorAll('.pdf-search-hl').forEach(el => el.remove());
            const matches = this._results.filter(r => r.page === pageNum);
            const cw = container.offsetWidth, ch = container.offsetHeight;
            // We use the rect from backend (in PDF points)
            matches.forEach(m => {
                if (!m.rect) return;
                // Approximate: use page viewport to convert
                const page0 = pdfDoc?.getPage ? null : null; // can't await here, use ratio
                const div = document.createElement('div');
                div.className = 'pdf-search-hl';
                // rect is [x0, y0, x1, y1] in PDF coordinates
                // We need the viewport scale - estimate from container
                const canvas = container.querySelector('canvas');
                if (!canvas) return;
                const scaleFactor = parseFloat(container.style.getPropertyValue('--scale-factor')) || 1;
                div.style.left = (m.rect[0] * scaleFactor) + 'px';
                div.style.top = (m.rect[1] * scaleFactor) + 'px';
                div.style.width = ((m.rect[2] - m.rect[0]) * scaleFactor) + 'px';
                div.style.height = ((m.rect[3] - m.rect[1]) * scaleFactor) + 'px';
                container.appendChild(div);
            });
        },
        _clearHighlights() {
            document.querySelectorAll('.pdf-search-hl').forEach(el => el.remove());
        }
    };
    window.Search = Search;

    /* ========== ChatStore (IndexedDB) ========== */
    const ChatStore = {
        _db: null,
        init() {
            return new Promise(resolve => {
                const req = indexedDB.open('reader3_chat', 1);
                req.onupgradeneeded = e => { e.target.result.createObjectStore('messages', { keyPath: 'bookId' }); };
                req.onsuccess = e => { ChatStore._db = e.target.result; resolve(); };
                req.onerror = () => resolve();
            });
        },
        save(bookId, data) {
            if (!this._db) return;
            try { const tx = this._db.transaction('messages', 'readwrite'); tx.objectStore('messages').put({ bookId, messages: data, updated: Date.now() }); } catch(e) {}
        },
        load(bookId) {
            if (!this._db) return Promise.resolve(null);
            return new Promise(resolve => {
                try {
                    const tx = this._db.transaction('messages', 'readonly');
                    const req = tx.objectStore('messages').get(bookId);
                    req.onsuccess = () => resolve(req.result?.messages || null);
                    req.onerror = () => resolve(null);
                } catch(e) { resolve(null); }
            });
        },
        remove(bookId) { if (!this._db) return; try { this._db.transaction('messages', 'readwrite').objectStore('messages').delete(bookId); } catch(e) {} }
    };

    /* ========== AI Module ========== */
    const AI = {
        _streaming: false,
        _sessions: [],
        _activeId: 0,
        _messages: [],
        _sessionId: 0,
        _msgId: 0,
        _context: '',
        _serverSaveTimer: null,
        _images: [],

        _currentSession() { return this._sessions.find(s => s.id === this._activeId); },
        _ensureSession() {
            if (!this._activeId || !this._currentSession()) {
                const session = { id: ++this._sessionId, title: '', messages: [], created: Date.now() };
                this._sessions.push(session);
                this._activeId = session.id;
                this._messages = session.messages;
            }
        },
        _persist() {
            const data = { sessions: this._sessions, activeId: this._activeId };
            ChatStore.save(`pdf_${BOOK_ID}`, data);
            // 同时持久化到服务端文件夹（防抖，避免频繁写盘）
            clearTimeout(this._serverSaveTimer);
            this._serverSaveTimer = setTimeout(() => {
                fetch(`/api/pdf-chat/${encodeURIComponent(BOOK_ID)}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                }).catch(() => {});
            }, 800);
        },
        _addContext(text) {
            this._context = text;
            const history = document.getElementById('ai-chat-history');
            document.getElementById('ai-empty-state').style.display = 'none';
            const div = document.createElement('div');
            div.className = 'chat-bubble context';
            div.textContent = text.length > 200 ? text.substring(0, 200) + '...' : text;
            history.appendChild(div);
            document.getElementById('ai-content').scrollTop = document.getElementById('ai-content').scrollHeight;
        },
        _addDelBtn(bubble, msgId) {
            const bar = document.createElement('div');
            bar.className = 'msg-bar';
            const delBtn = document.createElement('button');
            delBtn.title = t('Delete');
            delBtn.innerHTML = '<svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>';
            delBtn.onclick = () => this.deleteMessage(msgId);
            bar.appendChild(delBtn);
            bubble.appendChild(bar);
            bubble.dataset.msgId = msgId;
        },
        _saveMsg(role, html, text) {
            this._ensureSession();
            const msg = { id: ++this._msgId, role, html, ts: Date.now() };
            if (text !== undefined) msg.text = text;
            this._messages.push(msg);
            const session = this._currentSession();
            if (session && !session.title && role === 'user') {
                const t = (text !== undefined ? text : html.replace(/<[^>]*>/g, ''));
                session.title = t.length > 25 ? t.substring(0, 25) + '...' : t;
            }
            this._persist();
            return msg;
        },
        _htmlToText(html) {
            const div = document.createElement('div');
            div.innerHTML = html || '';
            return div.textContent || div.innerText || '';
        },
        _fileToDataUrl(file) {
            return new Promise((resolve, reject) => {
                if (file.size > 8 * 1024 * 1024) { reject(new Error('图片不能超过 8MB')); return; }
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = () => reject(new Error('读取图片失败'));
                reader.readAsDataURL(file);
            });
        },
        async addImages(files) {
            const list = Array.from(files || []).filter(f => f.type && f.type.startsWith('image/'));
            for (const f of list) {
                try {
                    const url = await this._fileToDataUrl(f);
                    this._images.push(url);
                } catch (e) { console.warn('[AI] 图片添加失败', e); }
            }
            this._renderImages();
        },
        removeImage(idx) {
            this._images.splice(idx, 1);
            this._renderImages();
        },
        _renderImages() {
            const box = document.getElementById('ai-images');
            if (!box) return;
            box.innerHTML = this._images.map((u, i) =>
                `<div class="ai-image-item"><img src="${u}" alt=""><button class="ai-image-del" onclick="AI.removeImage(${i})" title="移除">×</button></div>`
            ).join('');
        },
        async send() {
            const input = document.getElementById('ai-input');
            const question = input.value.trim();
            const hasImages = this._images.length > 0;
            if ((!question && !hasImages) || this._streaming) return;
            input.value = ''; input.style.height = 'auto';
            const ctx = this._context;
            this._context = '';
            const images = this._images.slice();
            this._images = [];
            this._renderImages();
            await this._send(question, ctx, images);
        },
        async _send(question, context, images) {
            images = images || [];
            const history = document.getElementById('ai-chat-history');
            document.getElementById('ai-empty-state').style.display = 'none';

            // User bubble
            const displayText = question || (images.length ? '[图片]' : '');
            const userMsg = this._saveMsg('user', question, question);
            const userDiv = document.createElement('div');
            userDiv.className = 'chat-bubble user';
            if (images.length) {
                const imgsHtml = images.map(u => `<img src="${u}" style="max-width:200px;max-height:200px;border-radius:8px;display:block;margin-bottom:6px">`).join('');
                userDiv.innerHTML = imgsHtml + (question ? `<div>${question.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</div>` : '');
            } else {
                userDiv.textContent = displayText;
            }
            this._addDelBtn(userDiv, userMsg.id);
            history.appendChild(userDiv);

            // AI bubble (streaming)
            const aiDiv = document.createElement('div');
            aiDiv.className = 'chat-bubble ai';
            aiDiv.innerHTML = '<span style="opacity:0.5">...</span>';
            history.appendChild(aiDiv);
            const content = document.getElementById('ai-content');
            content.scrollTop = content.scrollHeight;

            // 构造对话历史（不含当前这条 user 消息），让 AI 具备多轮上下文记忆
            const prevMsgs = this._messages.slice(0, -1).slice(-12)
                .filter(m => m.role === 'user' || m.role === 'ai')
                .map(m => ({ role: m.role, content: (m.text !== undefined ? m.text : this._htmlToText(m.html)) }));
            const chatHistory = prevMsgs.filter(m => m.content && m.content.trim());

            this._streaming = true;
            let fullText = '';
            try {
                const resp = await fetch('/api/ai/chat-context', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question, context, title: BOOK_TITLE, history: chatHistory, images })
                });
                const reader = resp.body.getReader();
                const decoder = new TextDecoder();
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    fullText += decoder.decode(value, { stream: true });
                    const cleaned = fullText.replace(/\n<!--model:.*?-->$/s, '');
                    aiDiv.innerHTML = _md(cleaned);
                    content.scrollTop = content.scrollHeight;
                }
            } catch (e) {
                fullText = `错误: ${e.message}`;
                aiDiv.innerHTML = fullText;
            }

            const cleanedFinal = fullText.replace(/\n<!--model:.*?-->$/s, '');
            const aiMsg = this._saveMsg('ai', _md(cleanedFinal), cleanedFinal);
            this._addDelBtn(aiDiv, aiMsg.id);
            renderMermaid(aiDiv);

            this._streaming = false;
        },
        deleteMessage(msgId) {
            const idx = this._messages.findIndex(m => m.id === msgId);
            if (idx !== -1) this._messages.splice(idx, 1);
            this._persist();
            const el = document.querySelector(`[data-msg-id="${msgId}"]`);
            if (el) { el.style.transition = 'opacity 0.3s, transform 0.3s'; el.style.opacity = '0'; el.style.transform = 'translateX(20px)'; setTimeout(() => el.remove(), 300); }
            const session = this._currentSession();
            if (session && session.messages.length === 0) {
                this._sessions = this._sessions.filter(s => s.id !== session.id);
                this._activeId = 0; this._messages = [];
                this._persist();
                setTimeout(() => { document.getElementById('ai-empty-state').style.display = ''; }, 350);
            }
        },
        clearChat() {
            if (!confirm(t('Clear all chat history?'))) return;
            const session = this._currentSession();
            if (session) {
                this._sessions = this._sessions.filter(s => s.id !== session.id);
                this._activeId = 0; this._messages = [];
            }
            document.getElementById('ai-chat-history').innerHTML = '';
            document.getElementById('ai-empty-state').style.display = '';
            this._persist();
            this._closeSessionList();
        },
        newSession() {
            const current = this._currentSession();
            if (!current || current.messages.length === 0) return;
            this._closeSessionList();
            this._activeId = 0; this._messages = [];
            this._persist();
            document.getElementById('ai-chat-history').innerHTML = '';
            document.getElementById('ai-empty-state').style.display = '';
        },
        switchSession(id) {
            const session = this._sessions.find(s => s.id === id);
            if (!session) return;
            this._activeId = id; this._messages = session.messages;
            document.getElementById('ai-empty-state').style.display = 'none';
            this._closeSessionList();
            this._renderMessages(session.messages);
            this._persist();
        },
        deleteSession(id) {
            if (!confirm(t('Delete this session?'))) return;
            this._sessions = this._sessions.filter(s => s.id !== id);
            if (this._activeId === id) {
                if (this._sessions.length > 0) {
                    const latest = this._sessions[this._sessions.length - 1];
                    this._activeId = latest.id; this._messages = latest.messages;
                    document.getElementById('ai-empty-state').style.display = 'none';
                    this._renderMessages(latest.messages);
                } else {
                    this._activeId = 0; this._messages = [];
                    document.getElementById('ai-chat-history').innerHTML = '';
                    document.getElementById('ai-empty-state').style.display = '';
                }
            }
            this._persist();
            const list = document.getElementById('session-list');
            if (list) { list.remove(); this.showSessionList(); }
        },
        showSessionList() {
            const existing = document.getElementById('session-list');
            if (existing) { this._closeSessionList(); return; }
            const list = document.createElement('div');
            list.id = 'session-list'; list.className = 'session-list';
            if (this._sessions.length === 0) {
                list.innerHTML = `<div class="session-empty">${t('No chat history')}</div>`;
            } else {
                [...this._sessions].sort((a, b) => b.created - a.created).forEach(s => {
                    const isActive = s.id === this._activeId;
                    const d = new Date(s.created);
                    const dateStr = `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
                    const item = document.createElement('div');
                    item.className = `session-item${isActive ? ' active' : ''}`;
                    item.onclick = () => AI.switchSession(s.id);
                    item.innerHTML = `<div class="session-title">${s.title || t('New Chat')}</div><div class="session-meta"><span>${dateStr}</span><span>${s.messages.length} ${t('messages')}</span></div><button class="session-del" onclick="event.stopPropagation();AI.deleteSession(${s.id})">×</button>`;
                    list.appendChild(item);
                });
            }
            const panel = document.getElementById('ai-panel');
            const content = document.getElementById('ai-content');
            panel.insertBefore(list, content);
        },
        _closeSessionList() { document.getElementById('session-list')?.remove(); },
        _renderMessages(messages) {
            const history = document.getElementById('ai-chat-history');
            history.innerHTML = '';
            messages.forEach(msg => {
                const bubble = document.createElement('div');
                bubble.className = `chat-bubble ${msg.role}`;
                bubble.innerHTML = msg.html;
                this._addDelBtn(bubble, msg.id);
                history.appendChild(bubble);
                if (msg.role === 'ai') renderMermaid(bubble);
            });
            document.getElementById('ai-content').scrollTop = document.getElementById('ai-content').scrollHeight;
        },
        async _restoreChat() {
            await ChatStore.init();
            let data = null;
            // 1. 优先从服务端文件夹读取（跨浏览器/跨设备持久化）
            try {
                const resp = await fetch(`/api/pdf-chat/${encodeURIComponent(BOOK_ID)}`);
                if (resp.ok) {
                    const d = await resp.json();
                    if (d && Array.isArray(d.sessions)) data = d;
                }
            } catch (e) {}
            // 2. 回退到浏览器 IndexedDB（旧数据兼容）
            if (!data) {
                data = await ChatStore.load(`pdf_${BOOK_ID}`);
            }
            if (!data || !data.sessions) return;
            if (data.sessions) {
                // 检测含转义 HTML 标签的坏数据，自动清空
                const hasBad = (data.sessions || []).some(s => (s.messages || []).some(m =>
                    m.role === 'ai' && m.html && /&lt;(\/?(p|strong|em|b|i|li|ul|ol|h[1-6]))/.test(m.html)));
                if (hasBad) {
                    this._sessions = []; this._activeId = 0; this._messages = [];
                    this._msgId = 0; this._sessionId = 0;
                    this._persist();
                    return;
                }
                this._sessions = data.sessions;
                this._activeId = data.activeId || 0;
                const allMsgIds = data.sessions.flatMap(s => s.messages.map(m => m.id));
                this._msgId = allMsgIds.length ? Math.max(...allMsgIds) : 0;
                this._sessionId = data.sessions.length ? Math.max(...data.sessions.map(s => s.id)) : 0;
                const active = this._currentSession();
                if (active) {
                    this._messages = active.messages;
                    this._renderMessages(active.messages);
                    document.getElementById('ai-empty-state').style.display = 'none';
                }
            }
        },
        quick(action) {
            const panel = document.getElementById('panels-container');
            if (panel.classList.contains('collapsed')) toggleRight();
            const prompts = {
                summarize: '请总结这本PDF的内容要点',
                concepts: '请详细解释这本书中的核心知识概念',
                difficult: '请解释当前阅读内容中的难点',
                reading: '基于本书内容，推荐一些拓展阅读',
                characters: '请梳理这本书中出现的主要人物',
                insight: '请对本书内容做一些深度洞察和分析',
                writing: '请分析本书的写作手法和文学特点',
            };
            document.getElementById('ai-input').value = prompts[action] || '';
            document.getElementById('ai-input').focus();
        }
    };
    window.AI = AI;

    /* ========== TTS Module ========== */
    const TTS = {
        player: new Audio(),
        rate: '+0%',
        voice: 'zh-CN-XiaoxiaoNeural',
        _speeds: [['-30%','0.7×'],['-15%','0.85×'],['+0%','1×'],['+15%','1.15×'],['+30%','1.3×'],['+50%','1.5×'],['+100%','2×']],
        _voices: [
            { group: 'Mandarin', items: [['zh-CN-XiaoxiaoNeural','Xiaoxiao · F'],['zh-CN-YunxiNeural','Yunxi · M'],['zh-CN-YunyangNeural','Yunyang · M']] },
            { group: 'English · US', items: [['en-US-AvaNeural','Ava · F'],['en-US-AndrewNeural','Andrew · M']] },
            { group: 'English · UK', items: [['en-GB-SoniaNeural','Sonia · F'],['en-GB-RyanNeural','Ryan · M']] }
        ],
        _leaveTimer: null,

        _buildSrc(text) {
            const voice = this._autoVoice(text);
            return `/api/tts?text=${encodeURIComponent(text)}&voice=${voice}&rate=${encodeURIComponent(this.rate)}`;
        },
        _autoVoice(text) {
            const cjk = (text.match(/[\u4e00-\u9fff]/g) || []).length;
            const isCJK = cjk > text.length * 0.15;
            const userIsCJK = this.voice.startsWith('zh-');
            if (isCJK && userIsCJK) return this.voice;
            if (!isCJK && !userIsCJK) return this.voice;
            return isCJK ? 'zh-CN-XiaoxiaoNeural' : 'en-US-AvaNeural';
        },
        speakSelection() {
            const text = Sel._selText;
            if (!text) return;
            this.player.src = this._buildSrc(text.substring(0, 1000));
            this.player.play().catch(() => {});
            document.getElementById('audio-console').classList.add('visible');
            this._updatePlayBtn(true);
        },
        toggleAll() {
            if (!this.player.paused) { this.player.pause(); this._updatePlayBtn(false); }
            else if (this.player.src) { this.player.play().catch(() => {}); this._updatePlayBtn(true); }
        },
        stop() {
            this.player.pause(); this.player.currentTime = 0;
            document.getElementById('audio-console').classList.remove('visible');
            this._updatePlayBtn(false);
        },
        _updatePlayBtn(playing) {
            const btn = document.getElementById('play-main-btn');
            if (playing) btn.innerHTML = '<svg viewBox="0 0 24 24" fill="white" stroke="white"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>';
            else btn.innerHTML = '<svg viewBox="0 0 24 24" fill="white" stroke="white"><polygon points="7 3 21 12 7 21 7 3"/></svg>';
        },
        setRate(rate) {
            this.rate = rate;
            const idx = this._speeds.findIndex(([r]) => r === rate);
            if (idx >= 0) this._updateSlider(idx);
            if (!this.player.paused && this.player.src) {
                const src = this.player.src.replace(/rate=[^&]*/, `rate=${encodeURIComponent(rate)}`);
                this.player.src = src; this.player.play().catch(() => {});
            }
        },
        showVoiceMenu(btn) {
            const popup = document.getElementById('voice-popup');
            if (popup.classList.contains('visible')) { this._hidePopups(); return; }
            this._hidePopups();
            const list = document.getElementById('voice-popup-list');
            let html = '<div class="ap-slider" id="voice-slider"></div>';
            this._voices.forEach(g => {
                html += `<div class="ap-group">${t(g.group)}</div>`;
                g.items.forEach(([id, name]) => {
                    const active = this.voice === id ? ' active' : '';
                    html += `<div class="ap-item${active}" data-voice="${id}" onclick="TTS._selectVoice(this,'${id}')"><span>${t(name)}</span><span class="ap-check">✓</span></div>`;
                });
            });
            list.innerHTML = html;
            this._showPopup(popup, btn);
            const activeItem = list.querySelector('.ap-item.active');
            if (activeItem) {
                activeItem.scrollIntoView({ block: 'center' });
                const slider = document.getElementById('voice-slider');
                slider.style.transition = 'none';
                slider.style.height = (activeItem.offsetHeight - 6) + 'px';
                slider.style.transform = `translateY(${activeItem.offsetTop + 3}px)`;
                requestAnimationFrame(() => slider.style.transition = '');
            }
        },
        _selectVoice(el, voiceId) {
            const list = document.getElementById('voice-popup-list');
            const slider = document.getElementById('voice-slider');
            list.querySelectorAll('.ap-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            slider.style.height = (el.offsetHeight - 6) + 'px';
            slider.style.transform = `translateY(${el.offsetTop + 3}px)`;
            this.voice = voiceId;
        },
        showSpeedMenu(btn) {
            const popup = document.getElementById('speed-popup');
            if (popup.classList.contains('visible')) { this._hidePopups(); return; }
            this._hidePopups();
            const wrap = document.getElementById('speed-slider-wrap');
            const idx = this._speeds.findIndex(([r]) => r === this.rate);
            const pct = (idx / (this._speeds.length - 1)) * 100;
            let labels = '';
            this._speeds.forEach(([rate, label]) => {
                const active = this.rate === rate ? ' active' : '';
                labels += `<span class="speed-label-dot${active}" onclick="TTS.setRate('${rate}')">${label}</span>`;
            });
            wrap.innerHTML = `<div class="speed-track" id="speed-track"><div class="speed-fill" id="speed-fill" style="width:${pct}%"></div><div class="speed-thumb" id="speed-thumb" style="left:${pct}%"></div></div><div class="speed-labels">${labels}</div>`;
            this._showPopup(popup, btn);
            const thumb = document.getElementById('speed-thumb');
            const track = document.getElementById('speed-track');
            const snapTo = (cx) => {
                const rect = track.getBoundingClientRect();
                const ratio = Math.max(0, Math.min(1, (cx - rect.left) / rect.width));
                const nearest = Math.round(ratio * (this._speeds.length - 1));
                this.setRate(this._speeds[nearest][0]);
            };
            thumb.style.cursor = 'grab';
            thumb.onmousedown = (e) => {
                e.preventDefault(); thumb.classList.add('dragging');
                const onMove = (ev) => snapTo(ev.clientX);
                const onUp = () => { thumb.classList.remove('dragging'); window.removeEventListener('mousemove', onMove); window.removeEventListener('mouseup', onUp); };
                window.addEventListener('mousemove', onMove); window.addEventListener('mouseup', onUp);
            };
            track.style.cursor = 'pointer';
            track.onclick = (e) => snapTo(e.clientX);
        },
        _updateSlider(idx) {
            const pct = (idx / (this._speeds.length - 1)) * 100;
            const fill = document.getElementById('speed-fill'), thumb = document.getElementById('speed-thumb');
            if (fill) fill.style.width = pct + '%';
            if (thumb) thumb.style.left = pct + '%';

        _showPopup(popup, anchor) {
            const rect = anchor.getBoundingClientRect();
            popup.style.visibility = 'hidden'; popup.classList.add('visible');
            const pw = popup.offsetWidth, ph = popup.offsetHeight;
            popup.style.visibility = '';
            let left = rect.left + rect.width / 2 - pw / 2, top = rect.top - ph - 8;
            if (top < 8) top = rect.bottom + 8;
            left = Math.max(8, Math.min(left, window.innerWidth - pw - 8));
            popup.style.left = left + 'px'; popup.style.top = top + 'px';
            setTimeout(() => document.addEventListener('mousedown', this._outsideHandler), 0);
            clearTimeout(this._leaveTimer);
            popup.onmouseleave = () => { this._leaveTimer = setTimeout(() => this._hidePopups(), 900); };
            popup.onmouseenter = () => clearTimeout(this._leaveTimer);
        },
        _hidePopups() {
            clearTimeout(this._leaveTimer);
            document.getElementById('voice-popup').classList.remove('visible');
            document.getElementById('speed-popup').classList.remove('visible');
            document.removeEventListener('mousedown', this._outsideHandler);

    /* ========== Resizable Sidebars ========== */
    function setupResizers() {
        const root = document.documentElement;
        const setup = (id, variable, side, storageKey) => {
            const resizer = document.getElementById(id);
            const panelId = side === 'left' ? 'sidebar' : 'panels-container';
            const panel = document.getElementById(panelId);
            const defaultWidth = side === 'left' ? 260 : 340;
            const snapThreshold = 80;
            const resistStart = 180;
            let dragging = false, lastRaw = 0, lastGoodWidth = null, rafId = 0;

            const applyWidth = () => {
                rafId = 0;
                if (lastRaw < resistStart) {
                    const t = lastRaw / resistStart;
                    const display = resistStart * Math.pow(t, 0.6);
                    root.style.setProperty(variable, display + 'px');
                    resizer.classList.toggle('snap-zone', lastRaw < snapThreshold);
                } else if (lastRaw <= 600) {
                    root.style.setProperty(variable, lastRaw + 'px');
                    localStorage.setItem(storageKey, lastRaw + 'px');
                    lastGoodWidth = lastRaw;
                    resizer.classList.remove('snap-zone');
                }
            };

            const onMove = (e) => {
                if (!dragging) return;
                lastRaw = side === 'left' ? e.clientX : window.innerWidth - e.clientX;
                lastRaw = Math.max(0, lastRaw);
                if (!rafId) rafId = requestAnimationFrame(applyWidth);
            };

            const onEnd = () => {
                dragging = false;
                document.body.classList.remove('is-dragging');
                resizer.classList.remove('snap-zone');
                window.removeEventListener('mousemove', onMove);
                window.removeEventListener('mouseup', onEnd);

                if (lastRaw < snapThreshold) {
                    root.style.setProperty(variable, (lastGoodWidth || defaultWidth) + 'px');
                    panel.classList.add('collapsed');
                    if (side === 'right') document.getElementById('toggle-right').classList.add('rotated');
                } else if (lastRaw < resistStart) {
                    root.style.setProperty(variable, resistStart + 'px');
                    localStorage.setItem(storageKey, resistStart + 'px');
                }
            };

            resizer.onmousedown = (e) => {
                if (panel.classList.contains('collapsed')) {
                    panel.style.transition = 'none';
                    panel.classList.remove('collapsed');
                    root.style.setProperty(variable, '0px');
                    panel.offsetHeight;
                    panel.style.transition = '';
                    if (side === 'right') document.getElementById('toggle-right').classList.remove('rotated');
                }
                lastGoodWidth = parseFloat(localStorage.getItem(storageKey)) || defaultWidth;
                lastRaw = 0;
                dragging = true;
                document.body.classList.add('is-dragging');
                window.addEventListener('mousemove', onMove);
                window.addEventListener('mouseup', onEnd);
                e.preventDefault();
            };
        };
        setup('left-resizer', '--sidebar-width', 'left', 'pdf_sidebar_width');
        setup('right-resizer', '--panels-width', 'right', 'pdf_panels_width');
    }

            case 'ArrowRight': case ' ': e.preventDefault(); viewer.scrollBy({ top: viewer.clientHeight - 80, behavior: 'smooth' }); break;

            case 'ArrowDown': e.preventDefault(); viewer.scrollBy({ top: 120, behavior: 'smooth' }); break;
            case 'Home': e.preventDefault(); viewer.scrollTo({ top: 0, behavior: 'smooth' }); break;

    /* ========== AI Provider Config ========== */
    const AIProvider = {
        _defs: {
            openai: 'OpenAI', anthropic: 'Anthropic', gemini: 'Google Gemini',
            deepseek: 'DeepSeek', grok: 'Grok (xAI)', dashscope: '阿里云百炼',
            volcengine: '火山引擎', hunyuan: '腾讯混元', minimax: 'MiniMax',
            moonshot: '月之暗面', siliconflow: '硅基流动', cerebras: 'Cerebras',
            sambanova: 'SambaNova', groq: 'Groq', mistral: 'Mistral',
            deepinfra: 'DeepInfra', together: 'Together AI', openrouter: 'OpenRouter',
            zhipuai: '智谱AI', modelscope: 'ModelScope', ollama: 'Ollama (本地)', cli: '本地 CLI (自动探测)', custom: '自定义 (OpenAI 兼容)'
        },
        _providers: [],
        _available: [],
        _modelLists: {},
        _localClis: [],
        _setStatus(msg, cls) {
            const el = document.getElementById('ai-provider-status');
            el.textContent = msg || '';

        },
        async load() {
            try {
                const resp = await fetch('/api/ai/providers');
                const data = await resp.json();
                this._providers = data.providers || [];
                this._available = data.available || Object.keys(this._defs);
                this._localClis = data.local_clis || [];
                this._renderSelect();
            } catch (e) {
                this._setStatus('加载配置失败: ' + e.message, 'fail');
            }
        },
        _renderSelect() {
            const sel = document.getElementById('ai-provider-select');
            sel.innerHTML = '';
            const order = ['deepseek', 'ollama', 'cli', 'gemini', 'openai', 'custom'];
            const rest = this._available.filter(id => !order.includes(id));
            const ids = [...order, ...rest];
            for (const id of ids) {
                const opt = document.createElement('option');
                opt.value = id;
                opt.textContent = this._defs[id] || id;
                sel.appendChild(opt);
            }
            const configured = this._providers.find(p => p.has_key);
            if (configured) sel.value = configured.id;
            this._applyCurrent();
        },
        _current() {
            const id = document.getElementById('ai-provider-select').value;
            return {
                id,
                existing: this._providers.find(p => p.id === id),
                keyInput: document.getElementById('ai-provider-key'),
                modelSelect: document.getElementById('ai-provider-model'),
                visionInput: document.getElementById('ai-provider-vision'),
                cliInput: document.getElementById('ai-provider-cli'),
                cliRow: document.getElementById('ai-provider-cli-row'),
                urlInput: document.getElementById('ai-provider-url'),
                urlRow: document.getElementById('ai-provider-url-row'),
            };
        },
        _applyCurrent() {
            const { id, existing, keyInput, modelSelect, visionInput, cliInput, cliRow, urlInput, urlRow } = this._current();
            this._renderModelOptions(id, (existing && existing.model) || '');
            if (visionInput) {
                if (existing && existing.vision_model) visionInput.value = existing.vision_model; else visionInput.value = '';
                // 留空时优先用服务商自带的视觉默认模型，而不是回退到可能不支持
                // 图片的文本模型。
                const visionDefault = (existing && existing.default_vision_model) || '';
                visionInput.placeholder = visionDefault
                    ? ('留空则用 ' + visionDefault)
                    : ((existing && existing.model) ? ('留空则用 ' + existing.model) : '留空则用上面模型');
            }
            if (cliInput && cliRow) {
                this._renderCliOptions(existing);
                cliRow.style.display = (id === 'cli') ? 'block' : 'none';
            }
            if (existing && existing.base_url) urlInput.value = existing.base_url; else urlInput.value = '';
            urlInput.placeholder = (existing && existing.default_base_url) ? existing.default_base_url : 'https://...';
            urlRow.style.display = (id === 'custom' || id === 'ollama') ? 'block' : 'none';
            // 本地 CLI 与 Ollama 都不需要 API Key；CLI 的模型也由该工具自行管理。
            const noKey = (id === 'cli' || id === 'ollama');
            const keyRow = document.getElementById('ai-provider-key-row');
            const modelRow = document.getElementById('ai-provider-model-row');
            const visionRow = document.getElementById('ai-provider-vision-row');
            if (keyRow) keyRow.style.display = noKey ? 'none' : 'block';
            if (modelRow) modelRow.style.display = (id === 'cli') ? 'none' : 'block';
            if (visionRow) visionRow.style.display = (id === 'cli') ? 'none' : 'block';
            keyInput.value = '';

            this._setStatus('', '');
        },
        _onChange() { this._applyCurrent(); },
        _renderModelOptions(id, selectedModel) {
            const select = document.getElementById('ai-provider-model');
            const models = this._modelLists[id] || [];
            const uniqueModels = [...new Set([selectedModel, ...models].filter(Boolean))];
            select.innerHTML = '';
            const defaultOption = document.createElement('option');
            defaultOption.value = '';
            defaultOption.textContent = '默认';
            select.appendChild(defaultOption);
            for (const model of uniqueModels) {
                const option = document.createElement('option');
                option.value = model;
                option.textContent = model;
                select.appendChild(option);
            }
            select.value = selectedModel || '';
        },
        _renderCliOptions(existing) {
            // 本地 CLI 无需 API Key：只列出后端探测到、本机确实装了的那些，
            // 用户从下拉里挑一个即可，命令模板由后端预置。
            const select = document.getElementById('ai-provider-cli');
            const hint = document.getElementById('ai-provider-cli-hint');
            const clis = this._localClis || [];
            const saved = (existing && existing.cli_command) || '';
            select.innerHTML = '';
            if (!clis.length) {
                const option = document.createElement('option');
                option.value = '';
                option.textContent = '未探测到本地 CLI';
                select.appendChild(option);
                select.disabled = true;
            } else {
                select.disabled = false;
                for (const cli of clis) {
                    const option = document.createElement('option');
                    option.value = cli.command;
                    option.textContent = cli.name + '（' + cli.id + '）';
                    select.appendChild(option);
                }
                // 保存过的模板可能是自定义的，补一项以免被静默丢弃。
                if (saved && !clis.some(cli => cli.command === saved)) {
                    const option = document.createElement('option');
                    option.value = saved;
                    option.textContent = '自定义：' + saved;
                    select.appendChild(option);
                }
                select.value = saved || clis[0].command;
            }
            if (hint) {
                hint.textContent = clis.length
                    ? '本机已安装：' + clis.map(cli => cli.id).join('、')
                    : '请先安装任一 CLI（如 claude、cursor-agent）后刷新。';
            }
        },
        async fetchModels() {
            const { id, existing, keyInput, urlInput, modelSelect } = this._current();
            const button = document.querySelector('.ai-provider-model-control .ai-provider-btn');
            const previousText = button.textContent;
            button.disabled = true;
            button.textContent = '获取中…';
            this._setStatus('正在获取可用模型…', 'info');
            try {
                const response = await fetch('/api/ai/fetch-models', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        id,
                        api_key: keyInput.value.trim(),
                        base_url: urlInput.value.trim() || (existing && existing.base_url) || '',
                    }),
                });
                const data = await response.json();
                if (!data.models || data.models.length === 0) {
                    throw new Error(data.error || '未获取到模型');
                }
                this._modelLists[id] = data.models;
                this._renderModelOptions(id, modelSelect.value);
                this._setStatus(`已获取 ${data.models.length} 个模型`, 'ok');
            } catch (error) {
                this._setStatus(`获取模型失败: ${error.message}`, 'fail');
            } finally {
                button.disabled = false;
                button.textContent = previousText;
            }
        },
        _collect() {
            const id = document.getElementById('ai-provider-select').value;
            const key = document.getElementById('ai-provider-key').value.trim();
            const model = document.getElementById('ai-provider-model').value;
            const visionInput = document.getElementById('ai-provider-vision');
            const vision = visionInput ? visionInput.value.trim() : '';
            const cliInput = document.getElementById('ai-provider-cli');
            const cli = cliInput ? cliInput.value.trim() : '';
            const url = document.getElementById('ai-provider-url').value.trim();
            const existing = this._providers.find(p => p.id === id);
            // 本地 CLI 不用 HTTP 模型名（模型由该命令行工具自行管理），也不设视觉模型，
            // 因此忽略这两个被隐藏的输入，避免残留旧值写进配置。
            const isCli = id === 'cli';
            return {
                id,
                api_key: key,
                enabled: true,
                model: isCli ? '' : (model || (existing && existing.model) || ''),
                vision_model: isCli ? '' : (vision || (existing && existing.vision_model) || ''),
                cli_command: cli || (existing && existing.cli_command) || '',
                base_url: url || (existing && existing.base_url) || '',
            };
        },
        async save() {
            const cfg = this._collect();
            const noKeyNeeded = cfg.id === 'ollama' || cfg.id === 'cli';
            if (!noKeyNeeded && !cfg.api_key && !(this._providers.find(p => p.id === cfg.id && p.has_key))) {
                this._setStatus('请先填写 API Key', 'fail');
                return;
            }
            if (cfg.id === 'cli' && !cfg.cli_command) {
                this._setStatus('未探测到可用的本地 CLI，请先安装（如 claude、cursor-agent）', 'fail');
                return;
            }
            this._setStatus('保存中...', 'info');
            const others = this._providers.filter(p => p.id !== cfg.id).map(p => ({
                id: p.id, api_key: '', enabled: p.enabled, model: p.model || '', base_url: p.base_url || '', vision_model: p.vision_model || '', cli_command: p.cli_command || ''
            }));
            try {
                const resp = await fetch('/api/ai/providers', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ providers: [...others, cfg] })
                });
                const data = await resp.json();
                if (data.ok) { this._setStatus('已保存 ✓', 'ok'); await this.load(); }
                else this._setStatus('保存失败: ' + (data.message || resp.status), 'fail');
            } catch (e) { this._setStatus('保存失败: ' + e.message, 'fail'); }
        },
        async test() {
            const cfg = this._collect();
            this._setStatus('测试中...', 'info');
            try {
                const resp = await fetch('/api/ai/test-provider', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(cfg)
                });
                const data = await resp.json();
                if (data.ok) this._setStatus('连接成功: ' + (data.message || 'OK'), 'ok');
                else this._setStatus('测试失败: ' + (data.message || resp.status), 'fail');
            } catch (e) { this._setStatus('测试失败: ' + e.message, 'fail'); }
        },
    };

    /* ========== Structured Chinese PDF: preview equals export ========== */
    const Bilingual = {
        _on: false, _cache: new Map(), _queue: [], _active: 0, _blockedReason: '',
        _pending: new Set(), _observer: null, MAX_CONCURRENT: 2,
        _range: 0, _requestedRange: 0,
        init() {
            try { this._on = localStorage.getItem('pdf_bilingual') === '1'; } catch {}
            const checkbox = document.getElementById('toggle-bilingual');
            checkbox.checked = this._on;
            checkbox.addEventListener('change', e => this.toggle(e.target.checked));
            const rangeSelect = document.getElementById('bilingual-range');
            if (rangeSelect) {
                let saved = 0;
                try { saved = Number(localStorage.getItem('pdf_bilingual_range')) || 0; } catch {}
                this._range = Math.max(0, saved);
                rangeSelect.value = String(this._range);
                rangeSelect.addEventListener('change', e => {
                    this._range = Math.max(0, Number(e.target.value) || 0);
                    try { localStorage.setItem('pdf_bilingual_range', String(this._range)); } catch {}
                    this._prefetchAround(currentPage);
                    this._status();
                });
            }
            this._observer = new IntersectionObserver(entries => {
                for (const entry of entries) if (entry.isIntersecting)
                    this._request(Number(entry.target.dataset.pageNum));
            }, { root: viewer, rootMargin: '800px 0px' });
            pageContainers.forEach(c => this._observer.observe(c));
            if (this._on) { this._request(currentPage); this._prefetchAround(currentPage); }
            this._status();
        },
        /// 翻页时按范围预取。只在页号变化时触发，避免滚动过程中反复排队。
        _onPageChange(page) {
            this._status();
            if (page !== this._requestedRange) {
                this._requestedRange = page;
                this._prefetchAround(page);
            }
        },
        _prefetchAround(page) {
            if (!this._on || this._range <= 0) return;
            const first = Math.max(1, page - this._range);
            const last = Math.min(pageContainers.length, page + this._range);
            for (let p = first; p <= last; p++) if (p !== page) this._request(p);
        },
        toggle(on) {
            this._on = on;
            document.getElementById('toggle-bilingual').checked = on;
            try { localStorage.setItem('pdf_bilingual', on ? '1' : '0'); } catch {}
            if (!on) {
                this._queue = [];
                for (const [page, entry] of this._cache) if (entry.status === 'queued') this._cache.delete(page);
            }
            pageContainers.forEach((_, i) => {
                if (pageRendered[i] || renderingPages.has(i + 1)) this._rerenderPage(i + 1);
            });
            if (on) { this._request(currentPage); this._prefetchAround(currentPage); }
            this._status();
        },
        pageDocument(pageNum) {
            const cached = this._cache.get(pageNum);
            return this._on && cached?.status === 'done' ? cached.doc : null;
        },
        _request(pageNum, force = false) {
            if (!this._on || pageNum < 1 || pageNum > pageContainers.length) return;
            const cached = this._cache.get(pageNum);
            if (!force && cached) return; // Failed pages require an explicit retry.
            if (cached?.status === 'loading') return;
            this._cache.set(pageNum, { status: 'queued' });
            this._queue.push({ pageNum, force });
            this._pump();
        },
        _pump() {
            while (this._on && this._active < this.MAX_CONCURRENT && this._queue.length) {
                const item = this._queue.shift();
                const cacheOnly = Boolean(this._blockedReason);
                this._start(item.pageNum, cacheOnly ? false : item.force, cacheOnly);
            }
        },
        async _start(pageNum, force, cacheOnly = false) {
            this._active++;
            this._cache.set(pageNum, { status: 'loading' });
            this._status();
            try {
                const resp = await fetch('/api/pdf-translation/' + encodeURIComponent(BOOK_ID), {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ page: pageNum, force, cache_only: cacheOnly })
                });
                const report = await resp.json();
                if (!resp.ok) throw new Error(cacheOnly && resp.status === 404
                    ? this._blockedReason + ' 本页尚无已生成的译文。' : report.detail || '生成失败');
                const serviceFailure = report.warnings.find(w => w.code === 'provider_unavailable');
                if (serviceFailure) {
                    this._blockedReason = serviceFailure.reason;
                }
                const doc = await getDocument(report.pdf_url + '?v=' + Date.now()).promise;
                this._cache.set(pageNum, { status: 'done', doc, report });
                this._rerenderPage(pageNum);
            } catch (e) {
                this._cache.set(pageNum, { status: 'error', message: e.message });
            } finally {
                this._active--;
                this._status();
                this._pump();
            }
        },
        _rerenderPage(pageNum) {
            if (renderingPages.has(pageNum)) { this._pending.add(pageNum); return; }
            if (!pageRendered[pageNum - 1]) return;
            pageRendered[pageNum - 1] = false;
            enqueueRender(pageNum);
        },
        render(pageNum, container) {
            const rect = container.getBoundingClientRect();
            const visible = viewer.getBoundingClientRect();
            if (this._on && rect.bottom >= visible.top - 800 && rect.top <= visible.bottom + 800)
                this._request(pageNum);
            this._status();
        },
        _status() {
            const node = document.getElementById('pdf-translation-status');
            if (!node) return;
            const cached = this._cache.get(currentPage);
            document.getElementById('translation-details-button').disabled = !this._on || !cached?.report;
            node.title = '';
            if (!this._on) node.textContent = '当前显示原文 PDF';
            else if (cached?.status === 'done') {
                const r = cached.report;
                node.textContent = '第 ' + currentPage + ' 页：已生成译文 ' + r.translation_count + '/' +
                    r.candidates + '；已排入原页 ' + r.placement_count + '/' + r.candidates +
                    (r.kept_count ? '；' + r.kept_count + ' 项标识符保留原文' : '') +
                    (r.unplaced_count ? '；' + r.unplaced_count + ' 项译文单独列出' : '') +
                    (r.pending_count ? '；' + r.pending_count + ' 项待翻译' : '') +
                    (r.warnings.length ? '；' + r.warnings.length + ' 项待检查' : '');
                node.title = r.warnings.map(w => (w.id || '页面') + ': ' + w.reason).join('\n');
                const serviceFailure = r.warnings.find(w => w.code === 'provider_unavailable');
                if (serviceFailure) node.textContent += '；' + serviceFailure.reason;
            } else node.textContent = cached?.status === 'error' ? '翻译失败：' + cached.message : '正在生成中文 PDF，暂显示原文…';
            if (this._on && this._range > 0) {
                const pendingPages = this._queue.length + this._active;
                node.textContent += '；预翻译前后各 ' + this._range + ' 页' +
                    (pendingPages ? '（队列 ' + pendingPages + ' 页）' : '');
            }
        },
        showDetails() {
            const report = this._cache.get(currentPage)?.report;
            if (!report) return;
            const dialog = document.getElementById('translation-details');
            document.getElementById('translation-details-title').textContent = '第 ' + currentPage + ' 页译文';
            const body = document.getElementById('translation-details-body');
            body.replaceChildren();
            const states = { placed: '已排入原页', unplaced: '译文单独列出', pending: '待翻译', kept: '无需翻译，保留原文' };
            for (const item of report.details || []) {
                const section = document.createElement('section');
                section.className = 'translation-detail';
                for (const [className, value] of [
                    ['translation-state', states[item.status] + (item.reason ? ' · ' + item.reason : '')],
                    ['translation-source', item.source],
                    ['translation-target', item.translation || '暂无通过校验的译文']
                ]) {
                    const paragraph = document.createElement('p');
                    paragraph.className = className;
                    paragraph.textContent = value;
                    section.append(paragraph);
                }
                body.append(section);
            }
            const regionalIds = new Set((report.details || []).map(item => item.id));
            for (const warning of report.warnings || []) {
                if (regionalIds.has(warning.id)) continue;
                const paragraph = document.createElement('p');
                paragraph.textContent = warning.reason;
                body.append(paragraph);
            }
            dialog.showModal();
        },
        retry() { this._blockedReason = ''; this._request(currentPage, true); },
        downloadPage() {
            const report = this._cache.get(currentPage)?.report;
            if (!report) { alert('请先开启翻译并等待当前页完成。'); return; }
            this._download(report.pdf_url);
        },
        _download(url) {
            const a = document.createElement('a');
            a.href = url; a.download = ''; a.click();
        },
        async downloadAll(button) {
            if (!confirm('将翻译整本文档的所有页面，可能产生较多翻译服务费用。继续吗？')) return;
            button.disabled = true;
            try {
                this.toggle(true);
                let version = null, review = 0;
                for (let p = 1; p <= pageContainers.length; p++) {
                    this._request(p);
                    while (['loading', 'queued'].includes(this._cache.get(p)?.status)) {
                        if (!this._on) throw new Error('已停止整本生成');
                        await new Promise(resolve => setTimeout(resolve, 300));
                    }
                    const entry = this._cache.get(p);
                    if (entry?.status !== 'done') throw new Error('第 ' + p + ' 页失败，请重试后继续');
                    if (version && version !== entry.report.version) throw new Error('模型配置已变化，请刷新页面重新生成');
                    version = entry.report.version;
                    review += entry.report.warnings.length;
                    button.textContent = p + '/' + pageContainers.length;
                }
                if (review) alert('有 ' + review + ' 个区域待检查，已保留原文。下载内容与网页预览一致。');
                this._download('/api/pdf-translation-download/' + encodeURIComponent(BOOK_ID) + '/' + version);
            } catch (e) { alert(e.message); }
            finally { button.disabled = false; button.textContent = '翻译并下载整本'; }
        }
    };
    window.Bilingual = Bilingual;

    /* ========== Init ========== */
    Highlights.load();
    Bookmarks.load();
    initThemes();
    AIProvider.load();
    Sel.init();
    AI._restoreChat();
    init();

    // Desktop: collapse AI panel by default
    if (window.innerWidth > 768) {
        document.getElementById('toggle-right').classList.add('rotated');
    }
    // Desktop: open sidebar if outline exists
    if (window.innerWidth > 768 && OUTLINE.length > 0) {
        document.getElementById('sidebar').classList.remove('collapsed');
    }
    // Restore saved panel widths
    if (window.innerWidth > 768) {
        const savedSidebar = localStorage.getItem('pdf_sidebar_width');
        const savedPanels = localStorage.getItem('pdf_panels_width');
        if (savedSidebar) document.documentElement.style.setProperty('--sidebar-width', savedSidebar);
        if (savedPanels) document.documentElement.style.setProperty('--panels-width', savedPanels);
    }
</script>
</body>
